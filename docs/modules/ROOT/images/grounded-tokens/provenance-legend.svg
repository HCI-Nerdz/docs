<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Grounded tokens -- provenance legend</title>
  <desc id="desc">Heuristic tokens use a dashed warm underline; researched tokens use a solid cool underline.</desc>
  <style>
    :root { --themed-svg-hci-provenance-color-canvas:#e8e4d9; --themed-svg-hci-provenance-color-text-primary:#0e1218; --themed-svg-hci-provenance-color-text-muted:#4b5563; --themed-svg-hci-provenance-color-status-warning:#9a5b00; --themed-svg-hci-provenance-color-status-success:#0f7a73; }
    @media (prefers-color-scheme: dark) { :root { --themed-svg-hci-provenance-color-canvas:#0e1218; --themed-svg-hci-provenance-color-text-primary:#e8e4d9; --themed-svg-hci-provenance-color-text-muted:#b6bdc8; --themed-svg-hci-provenance-color-status-warning:#e8a54b; --themed-svg-hci-provenance-color-status-success:#4fb3a6; } }
  </style>
  <rect width="720" height="220" fill="var(--themed-svg-hci-provenance-color-canvas, #e8e4d9)" rx="12"/>
  <text x="36" y="44" fill="var(--themed-svg-hci-provenance-color-text-primary, #0e1218)" font-family="Segoe UI, system-ui, sans-serif" font-size="18" font-weight="600">Provenance at a glance</text>
  <text x="36" y="92" fill="var(--themed-svg-hci-provenance-color-status-warning, #9a5b00)" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">HEURISTIC</text>
  <text x="36" y="122" fill="var(--themed-svg-hci-provenance-color-text-primary, #0e1218)" font-family="ui-monospace, Consolas, monospace" font-size="16">Retrying </text>
  <text x="132" y="122" fill="var(--themed-svg-hci-provenance-color-status-warning, #9a5b00)" font-family="ui-monospace, Consolas, monospace" font-size="16">AMDphreak/clients</text>
  <line x1="132" y1="128" x2="318" y2="128" stroke="var(--themed-svg-hci-provenance-color-status-warning, #9a5b00)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="340" y="122" fill="var(--themed-svg-hci-provenance-color-text-muted, #4b5563)" font-family="Segoe UI, system-ui, sans-serif" font-size="13">Assumed -- not verified</text>
  <text x="36" y="168" fill="var(--themed-svg-hci-provenance-color-status-success, #0f7a73)" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600">RESEARCHED</text>
  <text x="36" y="198" fill="var(--themed-svg-hci-provenance-color-text-primary, #0e1218)" font-family="ui-monospace, Consolas, monospace" font-size="16">The fork is </text>
  <text x="168" y="198" fill="var(--themed-svg-hci-provenance-color-status-success, #0f7a73)" font-family="ui-monospace, Consolas, monospace" font-size="16">AMDphreak/bitwarden-clients</text>
  <line x1="168" y1="204" x2="448" y2="204" stroke="var(--themed-svg-hci-provenance-color-status-success, #0f7a73)" stroke-width="2"/>
  <text x="470" y="198" fill="var(--themed-svg-hci-provenance-color-text-muted, #4b5563)" font-family="Segoe UI, system-ui, sans-serif" font-size="13">gh repo view / 2s ago</text>
</svg>
