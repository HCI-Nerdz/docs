<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 128" width="168" height="128" role="img" aria-labelledby="title desc">
  <title id="title">Labels versus wires</title>
  <desc id="desc">A stable hash core with a detachable human-readable path label</desc>
  <defs>
    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c6b6e"/>
      <stop offset="100%" stop-color="#145a5c"/>
    </linearGradient>
  </defs>
  <!-- Content identity (hex) -->
  <path fill="url(#core)" d="M52 16 L88 37 V79 L52 100 L16 79 V37 Z"/>
  <path fill="none" stroke="#e6eef2" stroke-width="3" stroke-linecap="round"
        d="M36 58h32M40 70h24M44 46h16"/>
  <text x="52" y="90" text-anchor="middle" fill="#b8d4d5" font-family="ui-monospace, Consolas, monospace" font-size="9">#a3f9</text>
  <!-- Detachable label -->
  <line x1="88" y1="48" x2="112" y2="32" stroke="#d4568c" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="108" y="16" width="52" height="24" rx="4" fill="#f4f7f8" stroke="#d4568c" stroke-width="2"/>
  <text x="134" y="32" text-anchor="middle" fill="#142029" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700">/docs/api</text>
</svg>
