<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
  <title id="title">Actor-model agentic UI node graph</title>
  <desc id="desc">Coordinator discussion node spawns task nodes; each node persists meta and chat on disk; grid is a filtered view.</desc>
  <defs>
    <marker id="spawn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3d9b8f"/>
    </marker>
    <marker id="mail" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4a5560"/>
    </marker>
    <style>
      .n { fill: #1a1f24; stroke-width: 1.5; rx: 8; }
      .disc { stroke: #e8a54b; }
      .task { stroke: #3d9b8f; }
      .coord { stroke: #7b9fd4; }
      .label { fill: #e8eef2; font-family: system-ui,sans-serif; font-size: 12px; font-weight: 600; }
      .sub { fill: #9aa8b4; font-family: system-ui,sans-serif; font-size: 10px; }
      .spawn-e { stroke: #3d9b8f; stroke-width: 1.4; fill: none; marker-end: url(#spawn); }
      .mail-e { stroke: #4a5560; stroke-width: 1.1; fill: none; stroke-dasharray: 4 3; marker-end: url(#mail); }
      .region { fill: none; stroke: #4a5560; stroke-dasharray: 6 4; rx: 10; }
    </style>
  </defs>
  <rect class="region" x="20" y="170" width="720" height="110"/>
  <text class="sub" x="380" y="285" text-anchor="middle">Grid view  filter type=task</text>
  <!-- Coordinator -->
  <rect class="n coord" x="310" y="20" width="140" height="52"/>
  <text class="label" x="380" y="42" text-anchor="middle">coordinator</text>
  <text class="sub" x="380" y="58" text-anchor="middle">nodes/coord-001/</text>
  <!-- Discussion -->
  <rect class="n disc" x="290" y="95" width="180" height="52"/>
  <text class="label" x="380" y="117" text-anchor="middle">discussion</text>
  <text class="sub" x="380" y="133" text-anchor="middle">spawnedBy: coord-001</text>
  <!-- Task nodes in grid -->
  <rect class="n task" x="50" y="195" width="120" height="48"/>
  <text class="label" x="110" y="217" text-anchor="middle">task</text>
  <text class="sub" x="110" y="232" text-anchor="middle">docs#3</text>
  <rect class="n task" x="200" y="195" width="120" height="48"/>
  <text class="label" x="260" y="217" text-anchor="middle">task</text>
  <text class="sub" x="260" y="232" text-anchor="middle">bitwarden</text>
  <rect class="n task" x="350" y="195" width="120" height="48"/>
  <text class="label" x="410" y="217" text-anchor="middle">task</text>
  <text class="sub" x="410" y="232" text-anchor="middle">openshellorg</text>
  <rect class="n disc" x="500" y="195" width="120" height="48"/>
  <text class="label" x="560" y="217" text-anchor="middle">discussion</text>
  <text class="sub" x="560" y="232" text-anchor="middle">CLA tangent</text>
  <!-- Spawn edges -->
  <path class="spawn-e" d="M380 72 L380 95"/>
  <path class="spawn-e" d="M340 147 L110 195"/>
  <path class="spawn-e" d="M360 147 L260 195"/>
  <path class="spawn-e" d="M400 147 L410 195"/>
  <path class="spawn-e" d="M430 147 L560 195"/>
  <!-- Disk -->
  <rect class="n" x="40" y="320" width="680" height="100" style="stroke:#4a5560"/>
  <text class="label" x="380" y="345" text-anchor="middle">$CHAT_ROOT/  graph.json + nodes/{id}/meta.json + chat.jsonl</text>
  <text class="sub" x="380" y="365" text-anchor="middle">spawnedBy / spawned[] written before child accepts messages</text>
  <text class="sub" x="380" y="385" text-anchor="middle">summaries/latest.json  mailbox for siblings</text>
  <!-- mailbox dashed between tasks -->
  <path class="mail-e" d="M170 219 L200 219"/>
  <path class="mail-e" d="M320 219 L350 219"/>
</svg>
