site:
  title: HCI Nerdz Docs
  url: https://hci-nerdz.github.io/docs
  start_page: hci-nerdz::index.adoc
  keys:
    header_logo: logo.svg
    site_home_url: https://hci-nerdz.github.io
    site_home_label: HCI Nerdz home
    header_doc_title: HCI Nerdz Docs

antora:
  extensions:
    - '@antora/lunr-extension'
    - require: '@antora-supplemental/unversioned-component-urls'
    - '@antora-supplemental/build-stack'

content:
  sources:
    - url: ./
      branches: HEAD
      start_path: docs

ui:
  bundle:
    url: https://github.com/antora-supplemental/valentus-theme/releases/download/v2/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui

asciidoc:
  attributes:
    stem: latexmath
    experimental: ''
    idprefix: ''
    idseparator: '-'
    page-pagination: ''
  extensions:
    - ./node_modules/@antora-supplemental/instruction-flow/lib/instruction-flow-extension.js

output:
  dir: build/site
