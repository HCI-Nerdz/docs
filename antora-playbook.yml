site:
  title: HCI Nerdz Docs
  url: https://hci-nerdz.github.io/docs
  robots: |
    User-agent: *
    Allow: /
    Sitemap: https://hci-nerdz.github.io/docs/sitemap.xml
  start_page: hci-nerdz::index.adoc
  keys:
    header_logo: logo.svg
    site_home_url: https://hci-nerdz.github.io
    site_home_label: HCI Nerdz home
    header_doc_title: HCI Nerdz Docs

urls:
  html_extension_style: indexify

antora:
  extensions:
    - require: '@antora-supplemental/facto-stack'
      profile: hub
      omit:
        - '@antora-supplemental/antora-search-chat'
        - '@antora-supplemental/site-nav-tree'
        - '@antora-supplemental/nav-typology'
        - '@antora-supplemental/nav-typology-diataxis'
        - '@antora-supplemental/link-validator'
        - '@antora-supplemental/linkinator'
        - '@antora-supplemental/soft-nav-page-toc'
        - '@antora-supplemental/extension-lister'
        - '@antora-supplemental/orphan-finder/extension'
        - '@antora-supplemental/page-context/antora'
        - '@antora-supplemental/mermaid-client/antora'
        - '@antora-supplemental/diagram-lightbox'

content:
  sources:
    - url: ./
      branches: HEAD
      start_path: docs

ui:
  bundle:
    url: https://github.com/antora-supplemental/valentus-theme/releases/download/v4.3.1/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui

asciidoc:
  attributes:
    stem: latexmath
    experimental: ''
    idprefix: ''
    idseparator: '-'
    page-pagination: ''
  extensions:
    - ./node_modules/@antora-supplemental/instruction-flow/lib/instruction-flow-extension.js

output:
  dir: build/site
